<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Make FM Scouting Data Again</title>
  <link rel="icon" type="image/png" href="/frontend/logo.png" />
  <link rel="apple-touch-icon" href="/frontend/logo.png" />
  <link rel="stylesheet" href="/frontend/styles.css" />
</head>
<body>
  <main class="shell">
    <section class="hero">
      <div class="brand-lockup">
        <img src="/frontend/logo.png" alt="Make FM Scouting Data Again logo" class="brand-logo" />
        <h1>Make FM Scouting Data Again</h1>
      </div>
      <p class="sub">A browser UI over your Football Manager MCP dataset. No VS Code required.</p>
      <p class="sub" id="dataSource">Data source: loading...</p>
      <div class="status" id="status"></div>
    </section>

    <section class="grid">
      <article class="card">
        <h2>Ranked by Metrics</h2>
        <div class="inputs">
          <div>
            <label for="rankPrompt">Prompt</label>
            <textarea id="rankPrompt" placeholder="Example: find wing backs with high crosses per 90 and progressive passes"></textarea>
          </div>
          <div>
            <label for="rankMinMinutes">Minutes override (min, optional)</label>
            <input id="rankMinMinutes" type="number" min="0" placeholder="1000" />
          </div>
          <div>
            <label for="rankLimit">Limit</label>
            <input id="rankLimit" type="number" min="1" max="100" value="10" />
          </div>
          <div>
            <label for="rankViewMode">Output view</label>
            <select id="rankViewMode">
              <option value="cards" selected>Cards</option>
              <option value="table">Table</option>
            </select>
          </div>
          <button id="rankButton">Run Ranking</button>
        </div>
      </article>

      <article class="card">
        <h2>Data Helpers</h2>
        <div class="inputs">
          <div>
            <label for="uploadFile">Upload FM HTML export</label>
            <input id="uploadFile" type="file" accept=".html,text/html" />
          </div>
          <button id="uploadButton">Upload Data</button>
          <button id="clearDataButton" class="button-danger">Clear Data</button>
          <button id="columnsButton">List Available Columns</button>
          <button id="clubsButton">List Clubs</button>
        </div>
      </article>
    </section>

    <section class="results">
      <p class="meta" id="meta">No query executed yet.</p>
      <div id="tableWrap"></div>
    </section>
  </main>

  <script src="/frontend/app.js"></script>
</body>
</html>
