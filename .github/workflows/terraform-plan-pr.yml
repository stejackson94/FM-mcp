name: Terraform Plan (PR)

on:
  pull_request:
    paths:
      - terraform/**
      - .github/workflows/terraform-plan-pr.yml
      - .github/workflows/deploy-ui-aws.yml

env:
  AWS_ACCESS_KEY_ID: ${{ secrets.TF_VAR_ACCESS_KEY }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.TF_VAR_SECRET_KEY }}
  AWS_REGION: ${{ vars.AWS_REGION || 'eu-west-2' }}
  TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET || 'fm-mcp' }}
  TF_STATE_KEY: ${{ vars.TF_STATE_KEY || 'fm-mcp/terraform.tfstate' }}
  TF_LOCK_TABLE: ${{ vars.TF_LOCK_TABLE || 'fm-mcp-tf-locks' }}

jobs:
  terraform-plan:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: ./terraform

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform fmt check
        run: terraform fmt -check -recursive

      - name: Ensure DynamoDB lock table exists
        run: |
          if ! aws dynamodb describe-table --table-name "$TF_LOCK_TABLE" --region "$AWS_REGION" >/dev/null 2>&1; then
            aws dynamodb create-table \
              --table-name "$TF_LOCK_TABLE" \
              --attribute-definitions AttributeName=LockID,AttributeType=S \
              --key-schema AttributeName=LockID,KeyType=HASH \
              --billing-mode PAY_PER_REQUEST \
              --region "$AWS_REGION"
          fi

      - name: Terraform Init
        run: |
          terraform init -input=false \
            -backend-config="bucket=$TF_STATE_BUCKET" \
            -backend-config="key=$TF_STATE_KEY" \
            -backend-config="region=$AWS_REGION" \
            -backend-config="dynamodb_table=$TF_LOCK_TABLE" \
            -backend-config="encrypt=true"

      - name: Terraform Validate
        run: terraform validate -no-color

      - name: Terraform Plan
        run: |
          SSH_KEY_NAME="${{ secrets.TF_VAR_SSH_KEY_NAME }}"
          if [[ -z "$SSH_KEY_NAME" ]]; then
            SSH_KEY_NAME="placeholder-key-name"
          fi

          SSH_ALLOWED_CIDR="${{ secrets.TF_VAR_SSH_ALLOWED_CIDR }}"
          if [[ -z "$SSH_ALLOWED_CIDR" ]]; then
            SSH_ALLOWED_CIDR="0.0.0.0/0"
          fi

          HTTP_ALLOWED_CIDR="${{ secrets.TF_VAR_HTTP_ALLOWED_CIDR }}"
          if [[ -z "$HTTP_ALLOWED_CIDR" ]]; then
            HTTP_ALLOWED_CIDR="0.0.0.0/0"
          fi

          terraform plan -no-color -input=false \
            -var="aws_region=${AWS_REGION}" \
            -var="ssh_key_name=${SSH_KEY_NAME}" \
            -var="http_allowed_cidr=${HTTP_ALLOWED_CIDR}" \
            -var="ssh_allowed_cidr=${SSH_ALLOWED_CIDR}"
