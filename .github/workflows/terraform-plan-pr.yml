name: Terraform Plan (PR)

on:
  pull_request:
    paths:
      - terraform/**
      - .github/workflows/terraform-plan-pr.yml
      - .github/workflows/deploy-ui-aws.yml

env:
  AWS_ACCESS_KEY_ID: ${{ secrets.TF_VAR_ACCESS_KEY }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.TF_VAR_SECRET_KEY }}
  AWS_REGION: ${{ vars.AWS_REGION || 'eu-west-2' }}

jobs:
  terraform-plan:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: ./terraform

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform fmt check
        run: terraform fmt -check -recursive

      - name: Terraform Init
        run: terraform init -input=false

      - name: Terraform Validate
        run: terraform validate -no-color

      - name: Terraform Plan
        run: |
          SSH_KEY_NAME="${{ secrets.TF_VAR_SSH_KEY_NAME }}"
          if [[ -z "$SSH_KEY_NAME" ]]; then
            SSH_KEY_NAME="placeholder-key-name"
          fi

          SSH_ALLOWED_CIDR="${{ secrets.TF_VAR_SSH_ALLOWED_CIDR }}"
          if [[ -z "$SSH_ALLOWED_CIDR" ]]; then
            SSH_ALLOWED_CIDR="0.0.0.0/0"
          fi

          HTTP_ALLOWED_CIDR="${{ secrets.TF_VAR_HTTP_ALLOWED_CIDR }}"
          if [[ -z "$HTTP_ALLOWED_CIDR" ]]; then
            HTTP_ALLOWED_CIDR="0.0.0.0/0"
          fi

          terraform plan -no-color -input=false \
            -var="aws_region=${AWS_REGION}" \
            -var="ssh_key_name=${SSH_KEY_NAME}" \
            -var="http_allowed_cidr=${HTTP_ALLOWED_CIDR}" \
            -var="ssh_allowed_cidr=${SSH_ALLOWED_CIDR}"
