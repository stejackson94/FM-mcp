[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "football-manager-data-mcp"
version = "0.1.0"
description = "A Python MCP server for football manager data exploration"
readme = "README.md"
license = "MIT"
authors = [
    { name = "Ste", email = "ste@example.com" },
]
keywords = ["python", "uv", "mcp", "football", "football-manager"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
requires-python = ">=3.12"
dependencies = [
    "mcp>=1.9.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "python-multipart>=0.0.9",
    "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.0",
    "pre-commit>=4.5.0",
]

[project.urls]
Homepage = "https://github.com/username/football-manager-data-mcp"
Repository = "https://github.com/username/football-manager-data-mcp.git"
Issues = "https://github.com/username/football-manager-data-mcp/issues"
Documentation = "https://github.com/username/football-manager-data-mcp#readme"

[project.scripts]
football-manager-data-mcp = "football_manager_data_mcp.server:main"
football-manager-data-ui = "football_manager_data_mcp.ui:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
football_manager_data_mcp = ["frontend/*.html", "frontend/*.css", "frontend/*.js"]

[tool.uv]
managed = true

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["src/test"]
addopts = "-v --tb=short"
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [
    ".git",
    ".venv",
    "venv",
    "__pycache__",
    ".pytest_cache",
]

[tool.ruff.format]
quote-style = "double"
docstring-code-format = true

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "N",
    "UP",
    "B",
    "A",
]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["football_manager_data_mcp", "src"]
force-single-line = false

[tool.coverage.run]
source = ["src"]
branch = true
omit = ["*/tests/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

[tool.uv.workspace]
members = []
